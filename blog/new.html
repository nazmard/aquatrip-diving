<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0262F5">
<title>ブログ新着記事｜八丈島アクアトリップダイビングブログ</title>
<style>
body{margin:0;background-color:#0262F5;background-image:url("body_back.jpg");font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#173447}
.wrap{max-width:780px;margin:0 auto;padding:18px 12px 50px}
header{color:#fff;text-align:center;padding:10px 0 16px}
header .blogname{font-size:clamp(20px,5vw,30px);font-weight:900;text-shadow:0 2px 8px #003a75}
header .tag{font-size:13px;margin-top:5px;text-shadow:0 1px 5px #003a75}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
nav a{background:#ffffff2b;border:1px solid #ffffff66;color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:7px 13px;border-radius:99px}
h1{color:#fff;font-size:20px;text-shadow:0 2px 8px #003a75;margin:10px 0 12px}
.card{display:flex;gap:13px;background:#fff;border-radius:14px;padding:13px;text-decoration:none;color:#173447;box-shadow:0 8px 22px #00264d2b;margin-bottom:11px;align-items:center}
.card img{width:92px;height:92px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#e8f2f5}
.card .noimg{width:92px;height:92px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,#00a6a6,#087eaa);display:grid;place-items:center;font-size:32px}
.card time{font-size:12px;color:#617985;font-weight:800}
.card strong{display:block;font-size:16px;color:#073b56;margin-top:3px;line-height:1.5}
.msg{background:#ffffffed;border-radius:14px;padding:18px;font-size:14px;line-height:1.9;color:#365263}
footer{color:#dff3ff;text-align:center;font-size:11px;margin-top:18px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="blogname">八丈島アクアトリップダイビングブログ</div>
<div class="tag">潜ればみんなお友達！八丈島アクアトリップダイビングの気まぐれブログ</div>
<nav><a href="./">📖 昔のブログ（2004〜2011）</a><a href="write.html">📝 記事を書く</a><a href="../">🌊 ホームページ</a></nav>
</header>
<h1>📝 新着記事</h1>
<div id="list"><div class="msg">記事を読み込んでいます…</div></div>
<footer>八丈島アクアトリップダイビング｜八丈島シュノーケリングセンター<br>Copyright(C) 1991- AQUATRIP DIVING All Rights Reserved</footer>
</div>
<script>
"use strict";
const API = "https://api.github.com/repos/nazmard/aquatrip-diving/contents/blog/posts";
const BASE = "posts/";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
async function main(){
  const list = document.getElementById("list");
  let files;
  try{
    const r = await fetch(API, {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("api");
    files = await r.json();
  }catch(e){
    list.innerHTML = '<div class="msg">新着記事を読み込めませんでした。時間をおいて開き直してみてください。</div>';
    return;
  }
  const posts = files.filter(f => f.type === "file" && /\.html?$/i.test(f.name)).sort((a,b)=> b.name.localeCompare(a.name)).slice(0, 40);
  if(!posts.length){
    list.innerHTML = '<div class="msg">まだ新しい記事はありません。これから投稿される記事が、ここに並びます。</div>';
    return;
  }
  list.innerHTML = "";
  for(const f of posts){
    try{
      const r = await fetch(BASE + encodeURIComponent(f.name));
      if(!r.ok) continue;
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const rawTitle = (doc.querySelector("title") || {}).textContent || f.name;
      const title = rawTitle.replace(/\s*-\s*八丈島アクアトリップダイビングブログ\s*$/, "");
      const timeEl = doc.querySelector("time");
      let date = timeEl ? (timeEl.getAttribute("datetime") || timeEl.textContent.trim()) : "";
      if(!date){
        const m = f.name.match(/(\d{4})(\d{2})(\d{2})/);
        if(m) date = m[1] + "-" + m[2] + "-" + m[3];
      }
      const img = doc.querySelector("article img");
      const imgSrc = img ? new URL(img.getAttribute("src"), new URL(BASE + f.name, location.href)).href : "";
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASE + encodeURIComponent(f.name);
      a.innerHTML = (imgSrc ? '<img src="' + esc(imgSrc) + '" alt="">' : '<span class="noimg">🌊</span>')
        + "<span><time>" + esc(date) + "</time><strong>" + esc(title) + "</strong></span>";
      list.appendChild(a);
    }catch(e){ /* skip broken file */ }
  }
  if(!list.children.length){
    list.innerHTML = '<div class="msg">記事の読み込みに失敗しました。時間をおいて開き直してみてください。</div>';
  }
}
main();
</script>
</body>
</html>
